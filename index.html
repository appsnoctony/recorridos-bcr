/* ================== SINCRONIZACIÓN MANUAL ================== */
function doManualSync(){
  if(!window.FirebaseSync||typeof FirebaseSync.syncNow!=='function') return;
  if(!DB){ toast('Espera un momento y vuelve a intentar','bad'); return; }
  const btn=$('#btnSync'); if(btn){btn.disabled=true;btn.textContent='⏳ Sincronizando…';}
  FirebaseSync.syncNow(false).then(r=>{
    if(r&&r.msg) toast(r.msg,r.ok?'ok':'bad');
    if(r&&r.ok){
      loadDB();
      if(!DB){ toast('No se pudieron cargar los datos, reinicia la app','bad'); return; }
      const techs=(DB.users||[]).filter(u=>u.role==='tech'&&u.active!==false);
      const lt=$('#lt');
      if(lt) lt.innerHTML=techs.map(u=>`<option value="${esc(u.name)}">${esc(u.name)}</option>`).join('');
      if(currentTab==='set') renderSettings();
      else if(currentTab==='myruns') renderMyRuns();
      else if(currentTab==='dash') renderDash();
      else if(currentTab==='hist') renderHistory();
      else if(currentTab==='alerts') renderAlerts();
      else if(currentTab==='users') renderUsers();
      updateBadges();
    }
  }).catch(e=>{
    console.warn('Sync manual falló:',e);
    try{ toast('⚠ No se pudo sincronizar (sin conexión?)','bad'); }catch(_){}
  }).finally(()=>{ if(btn){btn.disabled=false;btn.textContent='☁️ Sincronizar ahora';} });
}

function exportDB(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mantcap_respaldo.json';a.click();
  toast('Respaldo exportado','ok');
}
function importDB(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.questions||!d.runs)throw 0;DB=d;if(!DB.settings)DB.settings={pinned:[]};if(!DB.users)DB.users=[];saveDB();updateBadges();toast('Respaldo importado','ok');showTab('set');}catch(e){toast('Archivo inválido','bad');}};
  rd.readAsText(f);
}
function resetDB(){
  confirmModal('<p>Se restablecerán todas las preguntas y se regenerarán los recorridos demo. ¿Continuar?</p>',
    ()=>{seedDB();locFilter='ALL';chartGroup='';chartSelIds=[];dashFrom='';dashTo='';dashQuick='all';chFrom='';chTo='';chQuick='all';toast('Datos restablecidos','ok');showTab('dash');},'Restablecer');
}

/* ================== TÉCNICO · FORMULARIO (cronómetro pausable) ================== */
let formState=null, secNames=[];
function renderTechForm(){
  if(SES.role!=='tech'){$('#content').innerHTML='<div class="empty">El formulario de recorrido es solo para el perfil Técnico.</div>';return;}
  formState=loadDraft();
  if(!formState) formState={loc:'CAP',answers:{},notes:{},conf:{},openSecs:{},started:false,startedAt:null,endedAt:null,ticket:'',accumSec:0,pausedAt:null};
  if(formState.started===undefined){
    const hasAns=formState.answers&&Object.keys(formState.answers).length;
    formState.started=!!hasAns;
    if(!formState.started){formState.startedAt=null;formState.ticket='';}
    else if(!formState.startedAt) formState.startedAt=new Date().toISOString();
  }
  if(formState.accumSec==null) formState.accumSec=0;
  if(formState.pausedAt===undefined) formState.pausedAt=null;
  formState.openSecs=formState.openSecs||{};
  drawForm();
}
function loadDraft(){
  try{const d=JSON.parse(localStorage.getItem(DKEY));if(d&&d.tech===SES.name)return d;}catch(e){}
  return null;
}
function saveDraft(){localStorage.setItem(DKEY,JSON.stringify({...formState,tech:SES.name}));}
function discardDraft(){clearTimer();localStorage.removeItem(DKEY);formState=null;renderTechForm();}
function setStartLoc(l){formState.loc=l;saveDraft();drawForm();}
function switchLoc(l){
  if(Object.keys(formState.answers).length){
    clearTimer();
    confirmModal('<p>Cambiar de sitio descartará las respuestas y el cronómetro del recorrido actual. ¿Continuar?</p>',
      ()=>{formState={loc:l,answers:{},notes:{},conf:{},openSecs:{},started:false,startedAt:null,endedAt:null,ticket:'',accumSec:0,pausedAt:null};saveDraft();drawForm();},'Cambiar');
  }else{formState.loc=l;formState.openSecs={};saveDraft();drawForm();}
}
function answered(q){const v=formState.answers[q.id];return v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length);}
function elapsedSec(){
  if(!formState) return 0;
  const acc=formState.accumSec||0;
  if(!formState.startedAt) return acc;
  return acc+Math.max(0,Math.floor((Date.now()-new Date(formState.startedAt))/1000));
}
function tickTimer(){
  const el=$('#runTimer');
  if(el) el.textContent=fmtDur(elapsedSec());
}
function updateTimerUI(){
  if(!formState||!formState.started) return;
  const chip=$('#timerChip'), bp=$('#btnPause'), br=$('#btnResume');
  const paused=!!formState.pausedAt;
  if(chip){chip.classList.toggle('paused',paused);
    const st=$('#tstat'); if(st)st.textContent=paused?'· en pausa':'';}
  if(bp)bp.classList.toggle('hidden',paused);
  if(br)br.classList.toggle('hidden',!paused);
}
function timerPause(){
  if(!formState.started||formState.pausedAt) return;
  formState.accumSec=elapsedSec();
  formState.pausedAt=Date.now();
  formState.startedAt=null;
  saveDraft();updateTimerUI();tickTimer();
  toast('⏸ Cronómetro detenido','ok');
}
function timerResume(){
  if(!formState.started||!formState.pausedAt) return;
  formState.startedAt=new Date().toISOString();
  formState.pausedAt=null;
  saveDraft();updateTimerUI();
  toast('▶ Cronómetro reanudado','ok');
}
function timerReset(){
  confirmModal('<p>El cronómetro volverá a <b>cero</b>. Tus respuestas NO se borran. Si estaba corriendo, seguirá corriendo desde 0. ¿Continuar?</p>',
    ()=>{
      formState.accumSec=0;
      formState.pausedAt=null;
      formState.startedAt=formState.started?new Date().toISOString():null;
      saveDraft();updateTimerUI();tickTimer();
      toast('↺ Cronómetro reiniciado a cero','ok');
    },'Reiniciar');
}
function updateFormProgress(){
  const req=activeQs(formState.loc).filter(q=>q.required);
  const done=req.filter(answered).length;
  const pct=req.length?Math.round(done/req.length*100):0;
  const bar=document.querySelector('.prog i'); if(bar)bar.style.width=pct+'%';
  const c1=$('#formCnt'); if(c1)c1.textContent=`${done}/${req.length} requeridas · ${pct}%`;
  const c2=$('#formStickyCnt'); if(c2)c2.innerHTML=`<b>${done}</b>/${req.length} completadas`;
  updateSecHeaders();
}
function drawForm(){
  const qs=activeQs(formState.loc);
  const secs=[...new Set(qs.map(q=>q.section))];
  secNames=secs;
  formState.openSecs=formState.openSecs||{};
  $('#pageTitle').textContent='Recorrido '+formState.loc;

  if(!formState.started){
    clearTimer();
    $('#content').innerHTML=`
    <div class="card" style="max-width:540px;margin:24px auto">
      <div class="hd"><h3>▶ Iniciar recorrido</h3></div>
      <div class="bd">
        <div class="toolbar" style="margin-bottom:14px">
          <span style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase">Sitio:</span>
          <button class="chip ${formState.loc==='CAP'?'on':''}" onclick="setStartLoc('CAP')">CAP</button>
          <button class="chip ${formState.loc==='CPP'?'on':''}" onclick="setStartLoc('CPP')">CPP</button>
        </div>
        <div class="fld"><label>Número de SCTASK * (se llena manualmente)</label>
          <input id="startTicket" placeholder="Ej: SCTASK1072033" value="${esc(formState.ticket||'')}" onkeydown="if(event.key==='Enter')startFromPanel()"></div>
        <p style="font-size:12.5px;color:var(--mut);margin-bottom:14px">Al presionar <b>Iniciar recorrido</b> comienza el cronómetro y se habilitan los equipos a revisar. Podrás detenerlo, reanudarlo o reiniciarlo en cualquier momento.</p>
        <button class="btn btn-ok" style="width:100%;padding:14px;font-size:15px" onclick="startFromPanel()">▶ Iniciar recorrido</button>
      </div>
    </div>`;
    return;
  }

  const req=qs.filter(q=>q.required);
  const done=req.filter(answered).length;
  const pct=req.length?Math.round(done/req.length*100):0;
  $('#content').innerHTML=`
  <div class="tform-head">
    <div class="toolbar" style="margin-bottom:0">
      <span class="timerchip ${formState.pausedAt?'paused':''}" id="timerChip"><i></i>⏱ <span id="runTimer">${fmtDur(elapsedSec())}</span> <span id="tstat">${formState.pausedAt?'· en pausa':''}</span></span>
      <span class="ticketchip"># ${esc(formState.ticket)}</span>
      <button class="btn btn-gho btn-sm ${formState.pausedAt?'hidden':''}" id="btnPause" title="Detener el cronómetro" onclick="timerPause()">⏸ Detener</button>
      <button class="btn btn-ok btn-sm ${formState.pausedAt?'':'hidden'}" id="btnResume" title="Reanudar el cronómetro" onclick="timerResume()">▶ Reanudar</button>
      <button class="btn btn-gho btn-sm" title="Reiniciar el cronómetro a cero" onclick="timerReset()">↺ Reiniciar</button>
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div id="formCnt" style="font-size:11.5px;color:var(--mut);margin-top:4px">${done}/${req.length} requeridas · ${pct}%</div>
  </div>
  <div class="toolbar" style="margin:2px 0 6px">
    <button class="btn btn-gho btn-sm" onclick="toggleAllSecs(true)">Expandir todo</button>
    <button class="btn btn-gho btn-sm" onclick="toggleAllSecs(false)">Colapsar todo</button>
    <span style="flex:1"></span>
    <button class="btn btn-gho btn-sm" onclick="discardDraft()">Descartar borrador</button>
  </div>
  <p style="font-size:12px;color:var(--mut);margin:2px 2px 10px">👆 Toca un equipo para desplegar los elementos a revisar.</p>
  ${secs.map((s,i)=>{
    const open=!!formState.openSecs[s];
    return `<div class="sec" id="sec_${i}">
      <div class="st sec-hd" onclick="toggleSec(${i})">
        <span class="chev ${open?'open':''}" id="chev_${i}">▶</span>
        <span class="n">${i+1}</span>
        <span class="title">${esc(s)}</span>
        <span class="pills" id="secpill_${i}">${secPills(s)}</span>
      </div>
      <div class="sec-body ${open?'':'collapsed'}" id="secbody_${i}">
        ${qs.filter(q=>q.section===s).map(q=>`<div class="q" id="q_${q.id}">${qInner(q)}</div>`).join('')}
      </div>
    </div>`;
  }).join('')}
  <div class="sticky-finish"><span id="formStickyCnt"><b>${done}</b>/${req.length} completadas</span>
    <button class="btn btn-pri" onclick="finishRun()">Finalizar recorrido</button></div>
  <div style="height:80px"></div>`;
  clearTimer();
  tickTimer();
  timerInt=setInterval(tickTimer,1000);
}
function startFromPanel(){
  const t=$('#startTicket')?.value.trim();
  if(!t){toast('Escribe el número de SCTASK para iniciar','bad');$('#startTicket')?.focus();return;}
  formState.ticket=t;
  formState.started=true;
  formState.startedAt=new Date().toISOString();
  formState.endedAt=null;
  formState.accumSec=0;
  formState.pausedAt=null;
  saveDraft();
  toast('⏱ Recorrido iniciado · '+t,'ok');
  drawForm();
}
function secPills(sec){
  const qs=activeQs(formState.loc).filter(q=>q.section===sec);
  const reqSec=qs.filter(q=>q.required);
  const doneSec=reqSec.filter(answered).length;
  const oorN=qs.filter(q=>evalAnswer(q,formState.answers[q.id]??'').oor).length;
  let pills='';
  if(oorN) pills+=`<span class="pill bad">⚠ ${oorN}</span>`;
  pills+= reqSec.length===0
    ? `<span class="pill mut">${qs.length} ítems</span>`
    : (doneSec===reqSec.length
        ? `<span class="pill ok">✓ ${doneSec}/${reqSec.length}</span>`
        : `<span class="pill ${doneSec?'pen':'mut'}">${doneSec}/${reqSec.length}</span>`);
  return pills;
}
function toggleSec(i){
  const s=secNames[i]; if(s==null) return;
  const open=!formState.openSecs[s];
  formState.openSecs[s]=open; saveDraft();
  document.getElementById('secbody_'+i)?.classList.toggle('collapsed',!open);
  document.getElementById('chev_'+i)?.classList.toggle('open',open);
}
function toggleAllSecs(open){
  secNames.forEach((s,i)=>{
    formState.openSecs[s]=open;
    document.getElementById('secbody_'+i)?.classList.toggle('collapsed',!open);
    document.getElementById('chev_'+i)?.classList.toggle('open',open);
  });
  saveDraft();
}
function updateSecHeaders(){
  secNames.forEach((s,i)=>{
    const el=document.getElementById('secpill_'+i);
    if(el) el.innerHTML=secPills(s);
  });
}

/* Banda de estado de una pregunta (fuera de rango / dentro de parámetros).
   Vive en su propio contenedor para poder actualizarla SIN volver a dibujar
   el campo donde se escribe → el teclado ya no se cierra (v2.13). */
function bandHTML(q){
  const val=formState.answers[q.id];
  const ev=evalAnswer(q,val??'');
  if(ev.oor){
    return `<div class="oor"><b>⚠ Fuera de rango · esperado ${esc(ev.expected)}</b>
      <div class="exp">Si hubo una avería, marca la casilla y describe lo sucedido. Esta descripción aparecerá en el informe del recorrido.</div>
      <label><input type="checkbox" ${formState.conf[q.id]?'checked':''} onchange="setConf('${q.id}',this.checked)"> Se detectó una avería y fue reportada</label>
      <textarea rows="2" placeholder="Describe la avería, a quién se reportó y las acciones tomadas…" oninput="setNote('${q.id}',this.value)">${esc(formState.notes[q.id]||'')}</textarea></div>`;
  }
  if(answered(q)){
    return `<div class="okband">✓ Dentro de parámetros${rangeLabel(q)?' · '+rangeLabel(q):''}</div>`;
  }
  return '';
}
function qInner(q){
  const val=formState.answers[q.id];
  let ctrl='';
  if(q.type==='number'){
    ctrl=`<div class="in-num"><input type="number" inputmode="decimal" step="any" value="${val??''}" placeholder="—"
      oninput="setAns('${q.id}',this.value)"><span class="u">${esc(q.unit||'')}</span></div>`;
  }else if(q.type==='text'){
    ctrl=`<textarea rows="2" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;outline:none" placeholder="${esc(q.ph||'Escribe aquí…')}" oninput="setAns('${q.id}',this.value)">${esc(val||'')}</textarea>`;
  }else if(q.type==='multi'){
    ctrl=`<div class="opts">${(q.options||[]).map(o=>`<button class="opt ${(val||[]).includes(o.label)?'on':''}" onclick="toggleMulti('${q.id}','${esc(o.label)}')">${esc(o.label)}</button>`).join('')}</div>`;
  }else{ /* select · boolean */
    ctrl=`<div class="opts">${(q.options||[]).map(o=>`<button class="opt ${val===o.label?'on':''}" onclick="setAns('${q.id}','${esc(o.label)}')">${esc(o.label)}</button>`).join('')}</div>`;
  }
  return `<div class="qt">${esc(q.text)}${q.required?'<span class="req">*</span>':''}${rangeLabel(q)?`<span class="meta">Rango: ${rangeLabel(q)}</span>`:''}</div>${ctrl}<div id="band_${q.id}">${bandHTML(q)}</div>`;
}
function refreshQ(qid){const el=document.getElementById('q_'+qid);if(el)el.innerHTML=qInner(getQ(qid));}
function refreshBand(qid){
  const q=getQ(qid), el=document.getElementById('band_'+qid);
  if(q&&el) el.innerHTML=bandHTML(q);
}
function setAns(qid,val){
  formState.answers[qid]=val;
  saveDraft();
  const q=getQ(qid);
  /* Botones (select/boolean): se redibuja la pregunta.
     Campos de escritura (número/texto): SOLO se actualiza la banda de estado. */
  if(q&&(q.type==='select'||q.type==='boolean')) refreshQ(qid); else refreshBand(qid);
  updateFormProgress();
}
function toggleMulti(qid,label){
  const cur=formState.answers[qid]||[];
  formState.answers[qid]=cur.includes(label)?cur.filter(x=>x!==label):[...cur,label];
  saveDraft();refreshQ(qid);updateFormProgress();
}
function setConf(qid,v){formState.conf[qid]=v;saveDraft();}
function setNote(qid,v){formState.notes[qid]=v;saveDraft();}
function finishRun(){
  const missing=activeQs(formState.loc).filter(q=>q.required&&!answered(q));
  if(missing.length){
    toast(`Faltan ${missing.length} preguntas requeridas`,'bad');
    const q0=missing[0], i=secNames.indexOf(q0.section);
    if(i>=0&&!formState.openSecs[q0.section]){
      formState.openSecs[q0.section]=true;saveDraft();
      document.getElementById('secbody_'+i)?.classList.remove('collapsed');
      document.getElementById('chev_'+i)?.classList.add('open');
    }
    setTimeout(()=>document.getElementById('q_'+q0.id)?.scrollIntoView({behavior:'smooth',block:'center'}),80);
    return;
  }
  modal(`<div class="mh"><h3>Finalizar recorrido</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    <p style="font-size:13px;margin-bottom:10px">Sitio: <b>${esc(formState.loc)}</b> · Ticket: <b>${esc(formState.ticket)}</b></p>
    <p style="font-size:13px;margin-bottom:10px">Duración: <b class="timerchip" style="padding:5px 12px">⏱ ${fmtDur(elapsedSec())}</b>${formState.pausedAt?' <span style="color:var(--warn);font-size:12px">(actualmente en pausa — solo cuenta el tiempo efectivo)</span>':''}</p>
    <p style="font-size:12.5px;color:var(--mut)">Se registrará el recorrido con ${Object.keys(formState.answers).length} respuestas. La duración (sin pausas) quedará guardada en el informe.</p>
  </div>
  <div class="mf"><button class="btn btn-gho" onclick="closeModal()">Cancelar</button><button class="btn btn-ok" onclick="confirmFinish()">Confirmar y guardar</button></div>`);
}
function confirmFinish(){
  const ticket=formState.ticket||'SCTASK';
  const endedAt=new Date().toISOString();
  const durationSec=elapsedSec();
  const qs=activeQs(formState.loc);
  const run={id:uid('R'),loc:formState.loc,date:endedAt,techName:SES.name,ticket,
    startedAt:formState.startedAt,endedAt,durationSec,
    answers:{...formState.answers},outOfRange:[]};
  qs.forEach(q=>{
    const val=run.answers[q.id]; if(val===undefined)return;
    const ev=evalAnswer(q,val);
    if(ev.oor) run.outOfRange.push({qid:q.id,qtext:q.text,section:q.section,value:fmtVal(q,val),
      expected:ev.expected,confirmed:!!formState.conf[q.id],note:formState.notes[q.id]||'',reviewed:false,reviewNote:''});
  });
  DB.runs.unshift(run);saveDB();
  clearTimer();
  localStorage.removeItem(DKEY);formState=null;closeModal();
  toast('Recorrido guardado ✓ · Duración '+fmtDur(durationSec),'ok');
  updateBadges();showTab('myruns');
}

    </div>

  <div class="card"><div class="hd"><h3>Mis recorridos (${runs.length})</h3></div>
  ${runs.length?`<table class="tb"><tr><th>Fecha</th><th>Sitio</th><th>Ticket</th><th>Duración</th><th>Alertas</th><th></th></tr>
  ${runs.map(r=>`<tr>
    <td>${fmtDT(r.date)}</td><td>${locBadge(r.loc)}</td><td>${esc(r.ticket)}</td>
    <td style="white-space:nowrap">${fmtDur(runDur(r))}</td>
    <td>${r.outOfRange.length?`<span class="pill bad">${r.outOfRange.length}</span>`:'<span class="pill ok">0</span>'}</td>
    <td style="text-align:right"><button class="btn btn-gho btn-sm" onclick="openRunModal('${r.id}')">Ver</button></td>
  </tr>`).join('')}</table>`:'<div class="empty">Aún no has registrado recorridos</div>'}
  </div>`;
}

/* ================== INIT (☁️ Firebase) ================== */
async function init(){
  if(window.FirebaseSync){
    try{
      await FirebaseSync.init();
      const remote=await FirebaseSync.pull();
      /* Solo aceptar datos remotos con estructura válida */
      if(remote&&typeof remote==='object'&&Array.isArray(remote.questions)&&Array.isArray(remote.users)){
        localStorage.setItem(KEY,JSON.stringify(remote));
      }
    }catch(e){ console.warn('Firebase no disponible, usando datos locales',e); }
  }
  loadDB();
  if(!DB||!Array.isArray(DB.users)){ console.error('No se pudo inicializar la base de datos'); return; }
  /* Lista de login: solo técnicos activos */
  const lt=$('#lt');
  if(lt) lt.innerHTML=DB.users.filter(u=>u.role==='tech'&&u.active!==false).map(u=>`<option value="${esc(u.name)}">${esc(u.name)}</option>`).join('');
  const s=sessionStorage.getItem('mantcap_ses');
  if(s) openApp();
  /* Avisar y refrescar cuando cambie la conexión */
  window.addEventListener('online',()=>{
    if(SES&&window.FirebaseSync&&typeof FirebaseSync.syncNow==='function'){
      toast('🌐 Conexión restaurada — sincronizando…','ok');
      FirebaseSync.syncNow(true).catch(()=>{});
    }
  });
  window.addEventListener('offline',()=>{
    if(SES) toast('📴 Sin conexión — los cambios se guardan localmente','');
  });
}
init();

/* ================== PWA · Registrar Service Worker ================== */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(()=>console.log('✓ PWA lista (service worker activo)'))
      .catch(e=>console.warn('SW no registrado:',e));
  });
}
</script>
