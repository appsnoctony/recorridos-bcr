<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MantCAP · Gestión de Mantenimiento</title>
<meta name="theme-color" content="#0f1c2e"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<!-- Firebase (compat builds) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-sync.js"></script>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="MantCAP">
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --ink:#16233a; --mut:#5c6b82; --line:#e3e8ef;
  --pri:#0e5fd8; --pri2:#0a4aa8; --ok:#178f5f; --warn:#b97900; --bad:#d13c3c;
  --side:#0f1c2e; --side2:#16283f; --rad:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --navH:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3{font-weight:700}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 80% -10%,#1b3a63 0%,var(--side) 55%);}
.login-card{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo .mark{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.logo b{font-size:18px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:18px}
.role-tabs{display:flex;gap:8px;margin-bottom:14px}
.role-tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;color:var(--mut)}
.role-tabs button.on{border-color:var(--pri);color:var(--pri);background:#eef4ff}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri)}
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri2)}
.btn-gho{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-bad{background:var(--bad);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.6;cursor:default}
.demo{margin-top:14px;background:#f6f8fb;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mut);line-height:1.6}
.err{background:#fdecec;color:var(--bad);border:1px solid #f5c2c2;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{width:228px;background:var(--side);color:#c8d3e0;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30}
.side .brand{padding:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:8px}
.side nav{flex:1;padding:10px 8px;overflow:auto}
.nitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c8d3e0;font-weight:500;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-size:13.5px}
.nitem svg{width:17px;height:17px;flex:none}
.nitem.on{background:var(--pri);color:#fff}
.nitem:hover:not(.on){background:var(--side2)}
.nitem .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7f90a6}
.side .foot .ver{color:#4da3ff;font-weight:700}
.main{flex:1;margin-left:228px;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:16.5px}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut)}
.avatar{width:32px;height:32px;border-radius:99px;background:#eef4ff;color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.content{padding:20px 22px 40px;max-width:1400px;width:100%;min-width:0}
.mobnav{display:none}

/* ---------- COMPONENTES ---------- */
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);min-width:0}
.card .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{font-size:14px}
.card .hd .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .bd{padding:16px}
.kpi{padding:16px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--mut);margin-top:3px;font-weight:500}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:none}
.tb tr:hover td{background:#f8fafc}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:#e4f5ec;color:var(--ok)} .pill.bad{background:#fdecec;color:var(--bad)} .pill.pen{background:#fff4dc;color:var(--warn)} .pill.mut{background:#eef1f5;color:var(--mut)}
.pill.cap{background:#eaf1ff;color:var(--pri)} .pill.cpp{background:#f0e9ff;color:#6d3fd4}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
.chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;color:var(--mut)}
.chip.on{border-color:var(--pri);color:var(--pri);background:#eef4ff}
.empty{padding:34px;text-align:center;color:var(--mut);font-size:13px}
.chart-wrap{position:relative;height:320px}

/* ---------- SELECCIÓN DE MÉTRICAS (tarjetas por grupo) ---------- */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.mgrid>*{min-width:0}
.mgroup{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mg-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12.5px}
.mg-hd b{flex:1;min-width:0}
.mg-hd .cnt{font-size:11px;color:var(--mut);font-weight:600}
.mg-body{display:flex;flex-wrap:wrap;gap:2px;padding:5px 8px}
.mchk{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;user-select:none}
.mchk:hover{background:#f2f6fb}
.mchk.on{background:#eef4ff;color:var(--pri);font-weight:700}
.mchk input{accent-color:var(--pri);width:15px;height:15px;cursor:pointer}

/* ---------- CRONÓMETRO ---------- */
.timerchip{display:inline-flex;align-items:center;gap:7px;background:#0f5c3f;color:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.timerchip i{width:9px;height:9px;border-radius:99px;background:#7dffc0;animation:pu 1.4s infinite}
.timerchip.paused{background:#5c6b82}
.timerchip.paused i{background:#dfe6ee;animation:none}
.ticketchip{display:inline-flex;align-items:center;gap:6px;background:#eef4ff;color:var(--pri);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- FORM TÉCNICO ---------- */
.tform-head{position:sticky;top:0;z-index:15;background:rgba(242,245,249,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px 0;margin-bottom:6px}
.prog{height:8px;background:#e3e8ef;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .25s}
.sec{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--rad);background:#fff;box-shadow:var(--shadow);overflow:hidden}
.sec>.st{padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
.sec>.st .n{background:var(--pri);color:#fff;width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;flex:none}

/* ---------- ACORDEÓN DE EQUIPOS ---------- */
.sec>.st.sec-hd{cursor:pointer;user-select:none;-webkit-user-select:none}
.sec>.st.sec-hd:hover{background:#eef2f7}
.chev{display:inline-flex;align-items:center;justify-content:center;width:18px;font-size:11px;color:var(--mut);transition:transform .18s;flex:none}
.chev.open{transform:rotate(90deg)}
.sec-body.collapsed{display:none}
.sec-hd .title{flex:1;text-align:left;min-width:0;overflow-wrap:anywhere}
.sec-hd .pills{display:flex;gap:6px;align-items:center;flex:none}

.q{padding:13px 16px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q .qt{font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.q .qt .req{color:var(--bad)}
.q .meta{font-size:11.5px;color:var(--mut);font-weight:500}
.in-num{display:flex;align-items:center;gap:8px;max-width:280px}
.in-num input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none}
.in-num input:focus{border-color:var(--pri)}
.in-num .u{color:var(--mut);font-weight:600;font-size:13px;min-width:26px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;background:#fff;font-weight:500;cursor:pointer;user-select:none;font-size:13.5px}
.opt.on{border-color:var(--pri);background:#eef4ff;color:var(--pri);font-weight:700}
.oor{margin-top:10px;background:#fdecec;border:1px solid #f3b8b8;border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:12.5px}
.oor b{color:var(--bad);display:flex;align-items:center;gap:6px;font-size:12.5px;letter-spacing:.2px}
.oor .exp{color:#8a3232;margin:4px 0 8px}
.oor label{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px;font-size:12.5px}
.oor textarea{width:100%;border:1px solid #f3b8b8;border-radius:8px;padding:7px 9px;font-size:12.5px;resize:vertical}
.okband{margin-top:10px;background:#e4f5ec;border:1px solid #bfe6d2;border-left:4px solid var(--ok);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ok);font-weight:600}
.sticky-finish{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(16,24,40,.18);border-radius:99px;padding:8px 10px 8px 18px;font-size:13px}

/* ---------- MODAL / TOAST ---------- */
.mask{position:fixed;inset:0;background:rgba(10,18,30,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:900px}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:15px;min-width:0;overflow-wrap:anywhere}
.modal .mh .x{margin-left:auto;border:none;background:none;font-size:24px;color:var(--mut);line-height:1;padding:0 4px}
.modal .mb{padding:16px 18px;overflow:auto;-webkit-overflow-scrolling:touch}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;top:14px;right:14px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:#101c30;color:#fff;border-radius:10px;padding:11px 15px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:tin .25s;display:flex;gap:8px;align-items:center;max-width:340px}
.toast.ok{background:#0f5c3f}.toast.bad{background:#8f2424}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}

/* ================================================================
   RESPONSIVE · TABLETAS Y MÓVILES (v2.13)
   ================================================================ */
@media(max-width:860px){
  .side{display:none}
  .main{margin-left:0}

  /* Barra superior: compacta, no fija (evita choque con la barra de abajo) */
  .topbar{position:static;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;gap:8px}
  .topbar h1{font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .who{margin-left:0;flex:none;gap:8px}
  #whoName{display:none}

  /* Navegación inferior tipo app */
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--side);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
  .mobnav .nitem{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:3px;
    padding:6px 2px;margin:0;font-size:10px;line-height:1.15;text-align:center;position:relative;border-radius:10px}
  .mobnav .nitem svg{width:20px;height:20px}
  .mobnav .nitem span:not(.cnt){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mobnav .nitem .cnt{position:absolute;top:1px;left:calc(50% + 6px);margin:0;font-size:9px;padding:0 5px}

  .content{padding:12px 12px calc(var(--navH) + 28px + env(safe-area-inset-bottom))}

  /* Tarjetas y barras de herramientas */
  .card .hd{padding:12px}
  .card .hd .sp{margin-left:0;width:100%}
  .card .hd .sp input[type=date]{flex:1 1 120px;min-width:0}
  .card .bd{padding:12px}
  .toolbar{gap:6px}
  .toolbar input[type=date]{flex:1 1 130px;min-width:0}
  .toolbar input:not([type=date]),.toolbar select{flex:1 1 100%;min-width:0;max-width:100%!important}

  /* Tablas: desplazamiento horizontal dentro de su tarjeta */
  table.tb{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tb th,.tb td{padding:8px 9px;font-size:12.5px}

  /* Campos a 16px: evita el zoom automático de iOS al enfocar */
  input,select,textarea{font-size:16px!important}
  .in-num{max-width:100%}

  /* Formulario del técnico */
  .tform-head{padding-top:calc(8px + env(safe-area-inset-top))}
  .q{padding:12px}
  .opt{padding:10px 14px}
  .sticky-finish{left:10px;right:10px;transform:none;justify-content:space-between;border-radius:16px;
    bottom:calc(var(--navH) + 8px + env(safe-area-inset-bottom))}

  /* Ventanas como hoja inferior */
  .mask{align-items:flex-end;padding:0}
  .modal,.modal.wide{max-width:100%;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0}
  .modal .mb{padding:14px}
  .modal .mf{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .modal .mf .btn{flex:1 1 auto}

  /* Avisos a lo ancho */
  #toasts{left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));align-items:stretch}
  .toast{max-width:none}

  .chart-wrap{height:260px}
  .login-card{padding:22px}
}
@media(max-width:700px){.mgrid{grid-template-columns:1fr}}
@media(max-width:560px){
  .g3,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:12px}
  .kpi .v{font-size:21px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="logo"><span class="mark">M</span><b>MantCAP</b></div>
    <div class="sub">Gestión de mantenimiento CAP · CPP · Recorridos, mediciones y alertas</div>
    <div id="lerr" class="err hidden"></div>
    <div class="role-tabs">
      <button id="rtAdm" class="on" onclick="setRole('admin')">Administrador</button>
      <button id="rtTec" onclick="setRole('tech')">Técnico</button>
    </div>
    <div id="fAdmin">
      <div class="fld"><label>Usuario</label><input id="lu" value="admin" autocomplete="off"></div>
      <div class="fld"><label>Contraseña</label><input id="lp" type="password" value="admin123"></div>
      <button class="btn btn-pri" style="width:100%" onclick="doLogin()">Iniciar sesión</button>
    </div>
    <div id="fTech" class="hidden">
      <div class="fld"><label>Técnico</label><select id="lt"></select></div>
      <div class="fld"><label>PIN</label><input id="lpin" type="password" value="1234"></div>
      <button class="btn btn-pri" style="width:100%" onclick="doLogin()">Iniciar sesión</button>
    </div>
    <div class="demo"><b>Demo:</b> admin / admin123 · Técnicos PIN 1234 · <b style="color:#0e5fd8">v2.13</b></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="shell">
    <aside class="side" id="sideNav"></aside>
    <div class="main">
      <div class="topbar">
        <h1 id="pageTitle">Resumen</h1>
        <div class="who"><span id="whoName"></span><span class="avatar" id="whoAva"></span>
          <button class="btn btn-gho btn-sm" onclick="logout()">Salir</button></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <nav class="mobnav" id="mobNav"></nav>
</div>

<div id="modalHost"></div>
<div id="toasts"></div>

<script>
/* ================================================================
   MantCAP · PWA de gestión de mantenimiento
   v2.13 — Correcciones:
           · El teclado ya no se cierra al escribir (los campos de texto
             y los buscadores ya no se vuelven a dibujar en cada tecla).
           · PDF: se limpian símbolos no soportados (≥ ≤ → emojis…)
             para que las observaciones/anomalías se lean bien.
           · Diseño móvil: barra de navegación inferior, tablas con
             desplazamiento, ventanas tipo hoja, campos sin zoom en iOS.
   v2.12 — Correcciones de arranque (DB nula) y validación de datos remotos
   v2.11 — Sincronización manual (botón en admin y técnico),
           estado de conexión, última sincronización.

function fmtDur(sec){
  if(sec==null||isNaN(sec)) return '—';
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;

  return (h?h+'h ':'')+p(m)+'m '+p(s)+'s';
}
/* Texto seguro para PDF: las fuentes estándar de jsPDF solo soportan Latin-1.
   Símbolos como ≥ ≤ → Δ ✓ o emojis se ven como letras sueltas separadas
   ("d 6 0 %"), así que se convierten a equivalentes en ASCII. */
function pdfSafe(s){
  if(s==null) return '';
  return String(s)
    .replace(/[\u00A0\u202F\u2009\u200A\u2007]/g,' ')
    .replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/≠/g,'!=').replace(/±/g,'+/-')
    .replace(/→/g,'->').replace(/←/g,'<-').replace(/Δ/g,'Delta ')
    .replace(/[–—]/g,'-').replace(/[‘’‚]/g,"'").replace(/[“”„]/g,'"')
    .replace(/•/g,'-').replace(/…/g,'...')
    .replace(/[✓✔]/g,'OK').replace(/⚠/g,'!')
    .replace(/[^\x09\x0A\x20-\x7E\u00A1-\u00FF]/g,'')
    .replace(/[ \t]{2,}/g,' ')
    .trim();
}

function weightedPick(opts){
  const tot=opts.reduce((s,o)=>s+(o.w||(o.normal?25:1)),0);
  let r=Math.random()*tot;
  for(const o of opts){r-=(o.w||(o.normal?25:1));if(r<=0)return o.label;}
  return opts[opts.length-1].label;
}
function genDemoNum(q,loc,hm){
  if(q.hm){hm[q.hm]=+(hm[q.hm]+Math.random()*1.8+.3).toFixed(2);return hm[q.hm];}
  if(q.min!=null||q.max!=null){
    let lo=q.min, hi=q.max;
    if(lo==null&&hi!=null) lo=hi-(hi<=30?hi*.6:hi*.4);
    if(hi==null&&lo!=null) hi=lo+(lo<=30?lo*.6:lo*.4);
    const c=(lo+hi)/2, r=hi-lo;
    let v=c+(Math.random()-.5)*r*.55;
    if(Math.random()<.07) v=(Math.random()<.5? lo-r*.14 : hi+r*.14);
    return +v.toFixed(hi<10?2:1);
  }
  const t=q.text;
  if(/Potencia real Total|Potencia total/.test(t)) return Math.round(58+Math.random()*14);
  if(/Potencia/.test(t)) return Math.round(14+Math.random()*12);
  if(/Tiempo de respaldo/.test(t)) return +(20+Math.random()*9).toFixed(1);
  if(/PUE/.test(t)) return +(1.28+Math.random()*.14).toFixed(2);
  if(/Combustible/.test(t)) return Math.round(88+Math.random()*17);
  if(/Carga/.test(t)) return Math.round(40+Math.random()*215);
  if(/Corriente/.test(t)){
    if(/de entrada/.test(t)){
      if(loc==='CPP'&&/UPS/.test(t)) return Math.round(78+Math.random()*26);
      return Math.round(118+Math.random()*38);
    }
    if(/de salida/.test(t)){
      if(loc==='CPP'&&/UPS/.test(t)) return Math.round(70+Math.random()*24);
      return Math.round(105+Math.random()*32);
    }
    if(loc==='CPP'&&/UPS/.test(t)) return Math.round(70+Math.random()*28);
    if(/Medidor Principal/.test(t)) return Math.round(395+Math.random()*85);
    if(/UPS/.test(t)) return Math.round(108+Math.random()*85);
    if(/brazo|Brazo/.test(t)) return Math.round(170+Math.random()*80);
    return Math.round(150+Math.random()*130);
  }
  return Math.round(40+Math.random()*80);
}
function seedRuns(loc,hm){
  const qs=DB.questions.filter(q=>q.loc===loc);
  const techs=DB.users.filter(u=>u.role==='tech'&&(u.active!==false));
  const DEMO_NOTES=['Se detectó falla y se reportó al supervisor de turno.','Avería reportada, pendiente de repuesto.','Se reportó y se dejó funcionando en modo de respaldo.','Reportado por teléfono, se espera visita del proveedor.'];
  for(let d=13;d>=0;d--){
    const day=new Date(); day.setDate(day.getDate()-d); day.setHours(8,0,0,0);
    if(day.getDay()===0) continue;
    const tech=techs[(d+(loc==='CPP'?4:0))%techs.length];
    const dur=Math.floor((35+Math.random()*55)*60);
    const run={id:uid('R'),loc,date:day.toISOString(),techName:tech.name,
      ticket:'SCTASK10'+(72000+d*37+(loc==='CPP'?5103:0)),
      startedAt:day.toISOString(),
      endedAt:new Date(day.getTime()+dur*1000).toISOString(),
      durationSec:dur,
      answers:{},outOfRange:[]};
    qs.forEach(q=>{
      let val;
      if(q.type==='number') val=genDemoNum(q,loc,hm);
      else if(q.type==='text') val=Math.random()<.5?'Sin novedades. Todo en orden':'Sin parámetros fuera de rango reportados';
      else if(q.type==='multi'){
        val=q.options.filter(o=>o.normal).map(o=>o.label);
        const bads=q.options.filter(o=>!o.normal);
        if(bads.length&&Math.random()<.06) val.push(bads[Math.floor(Math.random()*bads.length)].label);
      }
      else val=weightedPick(q.options);
      run.answers[q.id]=val;
      const ev=evalAnswer(q,val);
      if(ev.oor) run.outOfRange.push({qid:q.id,qtext:q.text,section:q.section,value:fmtVal(q,val),expected:ev.expected,
        confirmed:Math.random()<.55,
        note:Math.random()<.4?DEMO_NOTES[Math.floor(Math.random()*DEMO_NOTES.length)]:'',
        reviewed:false,reviewNote:''});
    });
    DB.runs.push(run);
  }
}
function loadDB(){
  try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB||typeof DB!=='object'||!DB.questions||!Array.isArray(DB.questions)||!DB.questions.some(q=>q.loc==='CPP')){seedDB();return;}
  const ids=new Set(DB.questions.map(q=>q.id));
  if(ids.size!==DB.questions.length){seedDB();return;}
  if(!DB.settings||typeof DB.settings!=='object') DB.settings={pinned:[]};
  if(!Array.isArray(DB.settings.pinned)) DB.settings.pinned=[];
  if(!Array.isArray(DB.users)) DB.users=[];
  if(!Array.isArray(DB.runs)) DB.runs=[];
  DB.runs.sort((a,b)=>new Date(b.date)-new Date(a.date));
  DB.runs.forEach(r=>{
    if(!r||typeof r!=='object') return;
    if(!r.loc) r.loc='CAP';
    if(!r.answers||typeof r.answers!=='object') r.answers={};
    if(r.durationSec==null){

function evalAnswer(q,val){
  if(val===''||val==null||(Array.isArray(val)&&!val.length)) return {oor:false,skip:true};
  if(q.type==='number'){
    const v=parseFloat(val); if(isNaN(v)) return {oor:false,skip:true};
    if(q.min!=null&&v<q.min) return {oor:true,expected:'≥ '+q.min+(q.unit?' '+q.unit:'')};
    if(q.max!=null&&v>q.max) return {oor:true,expected:'≤ '+q.max+(q.unit?' '+q.unit:'')};
    return {oor:false};
  }
  if(q.type==='select'||q.type==='boolean'){
    const o=(q.options||[]).find(x=>x.label===val);
    if(o&&!o.normal) return {oor:true,expected:'Se espera: '+q.options.filter(x=>x.normal).map(x=>x.label).join(' / ')};
    return {oor:false};
  }
  if(q.type==='multi'){
    const bad=(val||[]).filter(l=>{const o=(q.options||[]).find(x=>x.label===l);return o&&!o.normal});
    if(bad.length) return {oor:true,expected:'No debería presentarse: '+bad.join(', ')};
    return {oor:false};
  }
  return {oor:false};
}
function fmtVal(q,val){
  if(val===''||val==null) return '—';
  if(Array.isArray(val)) return val.join(', ');
  if(q.type==='number') return val+(q.unit?' '+q.unit:'');
  return String(val);
}
function rangeLabel(q){
  if(q.min==null&&q.max==null) return '';
  if(q.min!=null&&q.max!=null) return `${q.min} – ${q.max}${q.unit?' '+q.unit:''}`;
  if(q.min!=null) return `≥ ${q.min}${q.unit?' '+q.unit:''}`;
  return `≤ ${q.max}${q.unit?' '+q.unit:''}`;
}

/* ================== AGRUPACIÓN (entrada/salida separadas) ================== */
const unitKey=q=>(q.unit||'').trim()||'val';
function groupKeyFor(q){
  const u=unitKey(q);
  if(u==='A'&&/corriente/i.test(q.text)){
    if(/de entrada/i.test(q.text)) return 'Entrada · A';
    if(/de salida/i.test(q.text)) return 'Salida · A';
  }
  return u;
}
function groupLabel(k){
  const map={'Entrada · A':'Corriente de entrada (A)','Salida · A':'Corriente de salida (A)','A':'Corriente (A)','kW':'Potencia (kW)','°C':'Temperatura (°C)','%':'Porcentaje (%)','min':'Tiempo (min)','V':'Voltaje (V)','PSI':'Presión (PSI)','°F':'Temperatura (°F)','val':'Valores'};
  return map[k]||('Valores ('+k+')');
}
function groupByUnit(qs){
  const m=new Map();
  qs.forEach(q=>{const k=groupKeyFor(q);if(!m.has(k))m.set(k,[]);m.get(k).push(q);});
  return [...m.entries()];
}
function metricInGroupLabel(q,gk){
  const t=shortName(q);
  const fase=t.match(/Fase\s+([ABC1-3])/i);
  if(gk==='Entrada · A'||gk==='Salida · A'||gk==='A'){
    if(fase) return 'Fase '+fase[1].toUpperCase();
    return t;
  }
  if(gk==='kW'){
    if(/total/i.test(t)) return 'Total';
    if(fase) return 'Fase '+fase[1].toUpperCase();
    return t;
  }
  return t;
}
function currentDiffs(qs,useRange=false){

  const out=[];
  qs.filter(q=>/de entrada/i.test(q.text)&&/Fase [ABC]/i.test(q.text)).forEach(e=>{
    const ph=e.text.match(/Fase ([ABC])/i)[1];
    const s=qs.find(q=>/de salida/i.test(q.text)&&q.text.includes('Fase '+ph.toUpperCase()));
    if(!s) return;

  });
  return out;
}

function groupChartConfig(qs,opts={}){
  const locs=[...new Set(qs.map(q=>q.loc))];
  const runs=DB.runs.filter(r=>locs.includes(r.loc)&&(locFilter==='ALL'||r.loc===locFilter)&&inChartRange(r)&&qs.some(q=>r.answers&&r.answers[q.id]!=null&&r.answers[q.id]!=='')).slice().reverse();
  const labels=runs.map(r=>fmtD(r.date));
  const datasets=qs.map((q,i)=>({label:shortName(q),
    data:runs.map(r=>{const v=r.answers?.[q.id];return v!=null&&v!==''?parseFloat(v):null;}),
    borderColor:CHART_COLORS[i%CHART_COLORS.length],backgroundColor:CHART_COLORS[i%CHART_COLORS.length],
    tension:.3,pointRadius:opts.small?2:2.5,borderWidth:2,fill:false,spanGaps:true}));
  if(qs.length<=3&&qs.every(q=>q.min===qs[0].min&&q.max===qs[0].max)){
    const q0=qs[0];
    if(q0.min!=null) datasets.push({label:'Mín '+q0.min,data:labels.map(()=>q0.min),borderColor:'#178f5f',borderDash:[6,4],pointRadius:0,fill:false});
    if(q0.max!=null) datasets.push({label:'Máx '+q0.max,data:labels.map(()=>q0.max),borderColor:'#d13c3c',borderDash:[6,4],pointRadius:0,fill:false});
  }
  return {runs,config:{type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{boxWidth:10,font:{size:10}}}},
      scales:{y:{beginAtZero:false}}}}};
}
function mountGroupChart(cv,qs,opts={}){
  if(!cv||!qs.length) return;
  const {runs,config}=groupChartConfig(qs,opts);
  new Chart(cv,config);

}
async function renderGroupImg(qs,opts={}){

  const img=cv.toDataURL('image/png');

/* ================== ADMIN · GRÁFICAS ================== */
let chartGroup='', chartSelIds=[], kwF='';
let chFrom='', chTo='', chQuick='all';
const KWS=['','Corriente','Potencia','Temperatura','Voltaje','Humedad','Presión','Tiempo','PUE'];
function kwLabel(k){return k||'Todas';}
function chQuickRange(k){
  chQuick=k;
  const t=new Date(); const iso=d=>d.toISOString().slice(0,10);
  if(k==='all'){chFrom='';chTo='';}
  else if(k==='today'){chFrom=iso(t);chTo=iso(t);}
  else if(k==='7'){const d=new Date();d.setDate(d.getDate()-6);chFrom=iso(d);chTo='';}
  else if(k==='30'){const d=new Date();d.setDate(d.getDate()-29);chFrom=iso(d);chTo='';}
  else if(k==='month'){chFrom=t.toISOString().slice(0,8)+'01';chTo='';}
  renderCharts();
}
function inChartRange(r){
  const d=r.date.slice(0,10);
  return (!chFrom||d>=chFrom)&&(!chTo||d<=chTo);
}
function chartRangeLabel(){
  if(!chFrom&&!chTo) return 'Todo el historial';
  const f=chFrom?fmtD(chFrom):'inicio', t=chTo?fmtD(chTo):'hoy';
  return `${f} → ${t}`;
}
function allNumQs(){return activeQs(locFilter).filter(q=>q.type==='number');}
function defaultSel(){
  const g=allNumQs().filter(q=>q.section===chartGroup);
  const cur=g.filter(q=>/corriente/i.test(q.text));
  return (cur.length?cur:g.slice(0,3)).map(q=>q.id);
}
function visQs(){
  return allNumQs().filter(q=>q.section===chartGroup&&(!kwF||q.text.toLowerCase().includes(kwF.toLowerCase())));
}
function groupVisQs(k){
  return visQs().filter(q=>groupKeyFor(q)===k);
}
function togGroup(k){
  const gq=groupVisQs(k);
  const allSel=gq.length>0&&gq.every(q=>chartSelIds.includes(q.id));
  gq.forEach(q=>{
    const i=chartSelIds.indexOf(q.id);
    if(allSel){ if(i>=0) chartSelIds.splice(i,1); }
    else if(i<0) chartSelIds.push(q.id);
  });
  renderCharts();
}
function renderCharts(){
  const qs=allNumQs();
  const secs=[...new Set(qs.map(q=>q.section))];
  if(!chartGroup||!secs.includes(chartGroup)){chartGroup=secs[0]||'';kwF='';chartSelIds=defaultSel();}
  chartSelIds=chartSelIds.filter(id=>qs.some(q=>q.id===id));
  if(!chartSelIds.length) chartSelIds=defaultSel();
  const vis=visQs();
  const gMap=new Map();
  vis.forEach(q=>{const k=groupKeyFor(q);if(!gMap.has(k))gMap.set(k,[]);gMap.get(k).push(q);});
  const selQs=chartSelIds.map(getQ).filter(Boolean);
  const selGroups=groupByUnit(selQs);
  const hasOut=selGroups.some(([k])=>k==='Salida · A');
  const diffIdx=selGroups.findIndex(([k])=>hasOut?k==='Salida · A':k==='Entrada · A');
  const cqc=k=>`<button class="chip ${chQuick===k?'on':''}" onclick="chQuickRange('${k}')">${{all:'Todo',today:'Hoy','7':'7 días','30':'30 días',month:'Este mes'}[k]}</button>`;
  $('#content').innerHTML=`${locBar()}
  <div class="card"><div class="hd"><h3>Comparativa por equipo · agrupadas por tipo</h3></div><div class="bd">
    ${qs.length?`
      <div class="toolbar">
        <span style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase">Equipo:</span>
        <select style="max-width:320px" onchange="chartGroup=this.value;kwF='';chartSelIds=defaultSel();renderCharts()">
          ${secs.map(s=>`<option ${s===chartGroup?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
        <span style="width:14px"></span>
        <span style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase">Filtrar:</span>
        ${KWS.map(k=>`<button class="chip ${kwF===k?'on':''}" onclick="kwF='${k}';renderCharts()">${kwLabel(k)}</button>`).join('')}
      </div>
      <div class="toolbar">
        <span style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase">Rango de fechas:</span>
        <input type="date" value="${chFrom}" onchange="chFrom=this.value;chQuick='custom';renderCharts()">
        <span style="color:var(--mut)">→</span>
        <input type="date" value="${chTo}" onchange="chTo=this.value;chQuick='custom';renderCharts()">
        ${cqc('all')}${cqc('today')}${cqc('7')}${cqc('30')}${cqc('month')}
        <span class="pill mut" style="margin-left:4px">📅 ${esc(chartRangeLabel())}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <span style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px">Métricas a graficar:</span>
        <button class="btn btn-gho btn-sm" onclick="selAllVis()">Todas</button>
        <button class="btn btn-gho btn-sm" onclick="clearSel()">Ninguna</button>
      </div>
      <div class="mgrid">
        ${[...gMap.entries()].map(([k,gq])=>{
          const allSel=gq.every(q=>chartSelIds.includes(q.id));
          const selN=gq.filter(q=>chartSelIds.includes(q.id)).length;
          return `<div class="mgroup">
            <div class="mg-hd">
              <b>${esc(groupLabel(k))}</b>
              <span class="cnt">${selN}/${gq.length}</span>
              <button class="btn ${allSel?'btn-gho':'btn-ok'} btn-sm" onclick="togGroup('${esc(k)}')">${allSel?'Ninguna':'Todas'}</button>
            </div>
            <div class="mg-body">
              ${gq.map(q=>`<label class="mchk ${chartSelIds.includes(q.id)?'on':''}" title="${esc(q.text)}">
                <input type="checkbox" ${chartSelIds.includes(q.id)?'checked':''} onchange="togChart('${q.id}')">
                ${esc(metricInGroupLabel(q,k))}
              </label>`).join('')}
            </div>
          </div>`;
        }).join('')||'<span style="color:var(--mut);font-size:13px">Sin métricas para este filtro</span>'}
      </div>
      <div class="toolbar">
        <span style="flex:1"></span>
        <button class="btn btn-ok btn-sm" onclick="reportModal()">📄 Generar informe</button>
      </div>`
    :'<div class="empty">No hay mediciones numéricas para esta ubicación</div>'}
  </div></div>
  ${qs.length?`<div class="grid g2" style="margin-top:14px">
    ${selGroups.map(([unit,gq],gi)=>{
      return `<div class="card">
        <div class="hd"><h3>Comparativa · ${esc(groupLabel(unit))}</h3>
          <span class="sp"><span class="pill mut">${esc(chartGroup)}</span><span class="pill cap">${gq.length} series</span></span></div>
        <div class="bd"><div class="chart-wrap" style="height:280px"><canvas id="mcg_${gi}"></canvas></div>
          <p id="mgmeta_${gi}" style="margin-top:8px;font-size:12px;color:var(--mut)"></p></div>
      </div>`;
    }).join('')||'<div class="empty" style="grid-column:1/-1">Selecciona métricas para comparar</div>'}
  </div>`:''}`;
  selGroups.forEach(([unit,gq],gi)=>{
    const runs=mountGroupChart($('#mcg_'+gi),gq);
    const meta=$('#mgmeta_'+gi); if(!meta) return;
    let extra='';
    if(gi===diffIdx){
      const diffs=currentDiffs(selQs,true);
      if(diffs.length) extra=`<br>Entrada → salida: ${diffs.join(' · ')}`;
    }
    const period=runs&&runs.length?` · ${fmtD(runs[0].date)} → ${fmtD(runs[runs.length-1].date)}`:'';
    meta.innerHTML=`${gq.length} series · ${runs?.length||0} recorridos en <b>${esc(chartRangeLabel())}</b>${period}${extra}`;
    if(!runs||!runs.length) meta.innerHTML+=`<br><span style="color:var(--warn)">No hay recorridos en el rango seleccionado — amplía el filtro de fechas.</span>`;
  });
}
function togChart(id){
  const i=chartSelIds.indexOf(id);
  if(i>=0) chartSelIds.splice(i,1); else chartSelIds.push(id);
  renderCharts();
}
function selAllVis(){
  visQs().forEach(q=>{if(!chartSelIds.includes(q.id))chartSelIds.push(q.id);});
  renderCharts();
}
function clearSel(){chartSelIds=[];renderCharts();}

/* ================== INFORME DE ANÁLISIS ================== */
let repTeams=[];
function chartStats(q){
  const runs=DB.runs.filter(r=>r.loc===q.loc&&(locFilter==='ALL'||r.loc===locFilter)&&inChartRange(r)&&r.answers&&r.answers[q.id]!=null&&r.answers[q.id]!=='').slice().reverse();
  const vals=runs.map(r=>parseFloat(r.answers[q.id])).filter(v=>!isNaN(v));
  if(!vals.length) return null;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const oor=vals.filter(v=>(q.min!=null&&v<q.min)||(q.max!=null&&v>q.max)).length;
  return {n:vals.length,avg,mn,mx,last:vals[vals.length-1],oor,pct:((oor/vals.length)*100).toFixed(1)};
}
function oorRowsForQs(qs){
  const rows=[];
  qs.forEach(q=>{
    DB.runs.filter(r=>r.loc===q.loc&&(locFilter==='ALL'||r.loc===locFilter)&&inChartRange(r)).forEach(r=>{
      const a=(r.outOfRange||[]).find(x=>x.qid===q.id);
      if(a) rows.push([fmtD(r.date),shortName(q),a.value,a.expected,(a.confirmed?'Reportada':'No reportada')+(a.note?' — '+a.note:'')]);
    });
  });
  return rows;
}
function repTeamList(){
  return [...new Set(allNumQs().map(q=>q.section))];
}
function repCountLabel(){
  const n=repTeams.length;
  return n===0?'Ninguno seleccionado':n===1?'1 equipo seleccionado':`${n} equipos seleccionados`;
}
function togRepEq(i){
  const all=repTeamList();
  const s=all[i]; if(s==null) return;
  const ix=repTeams.indexOf(s);
  if(ix>=0) repTeams.splice(ix,1); else repTeams.push(s);
  document.getElementById('req_'+i)?.classList.toggle('on',repTeams.includes(s));
  const cnt=$('#repCount'); if(cnt) cnt.textContent=repCountLabel();
}
function repSelAll(on){
  repTeams=on?[...repTeamList()]:[];
  repTeamList().forEach((s,i)=>{
    document.getElementById('req_'+i)?.classList.toggle('on',repTeams.includes(s));
  });
  const cnt=$('#repCount'); if(cnt) cnt.textContent=repCountLabel();
}
function reportModal(){
  if(!chartSelIds.length){toast('Selecciona al menos una métrica','bad');return;}
  const selQs=chartSelIds.map(getQ).filter(Boolean);
  const groups=groupByUnit(selQs);
  const locs=[...new Set(selQs.map(q=>q.loc))];
  const nRuns=DB.runs.filter(r=>locs.includes(r.loc)&&(locFilter==='ALL'||r.loc===locFilter)&&inChartRange(r)).length;
  if(!nRuns){toast('No hay recorridos en el rango seleccionado — ajusta las fechas','bad');return;}
  const teams=repTeamList();
  repTeams=[chartGroup];
  modal(`<div class="mh"><h3>📄 Generar informe de análisis</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    <div style="background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin-bottom:12px">
      <b style="color:var(--ink)">Período:</b> ${esc(chartRangeLabel())} · ${nRuns} recorridos<br>
      <b style="color:var(--ink)">El informe incluye por equipo:</b> todas sus métricas numéricas, gráficas separadas (entrada/salida/kW/°C…), resumen estadístico y hallazgos fuera de rango.
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <span style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px">Equipos a incluir (toca para seleccionar uno o varios):</span>
      <span class="pill cap" id="repCount">1 equipo seleccionado</span>
      <span style="flex:1"></span>
      <button class="btn btn-gho btn-sm" onclick="repSelAll(true)">Todos</button>
      <button class="btn btn-gho btn-sm" onclick="repSelAll(false)">Ninguno</button>
    </div>
    <div class="opts" style="margin-bottom:12px">
      ${teams.map((s,i)=>`<button class="opt ${repTeams.includes(s)?'on':''}" id="req_${i}" onclick="togRepEq(${i})">${esc(s)}</button>`).join('')}
    </div>
    <div class="fld"><label>Título del informe</label>
      <input id="repTitle" value="Informe de análisis · ${esc(locFilter==='ALL'?'CAP + CPP':locFilter)}"></div>
    <div class="fld"><label>Comentarios finales (conclusiones, recomendaciones, seguimiento…)</label>
      <textarea id="repComments" rows="5" placeholder="Ej: Las corrientes de entrada se mantienen estables. Se recomienda monitorear la Fase B…"></textarea></div>
  </div>
  <div class="mf">
    <button class="btn btn-gho" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-ok" onclick="genTeamReport()">📄 Generar PDF</button>
  </div>`);
}
async function genTeamReport(){
  const title=($('#repTitle')?.value.trim())||'Informe de análisis';
  const comments=($('#repComments')?.value.trim())||'';
  if(!repTeams.length){toast('Selecciona al menos un equipo','bad');return;}
  const numQs=allNumQs().filter(q=>repTeams.includes(q.section));
  if(!numQs.length){toast('Los equipos seleccionados no tienen métricas numéricas','bad');return;}
  const secs=repTeams.filter(s=>numQs.some(q=>q.section===s));
  closeModal();
  toast(`⏳ Generando informe (${secs.length} equipo${secs.length>1?'s':''})…`);
  await new Promise(r=>setTimeout(r,150));
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const PW=210, PH=()=>doc.internal.pageSize.getHeight();
  const ML=14, CW=182;
  const PRI=[14,95,216], PRI2=[10,74,168], INK=[22,35,58], MUT=[92,107,130],
        BAD=[209,60,60], LIGHT=[242,245,249], LINE=[227,232,239],
        OKC=[23,143,95], OKBG=[228,245,236], OKLN=[191,230,210], SKY=[125,193,255];
  const safe=s=>String(s).replace(/[^a-z0-9]+/gi,'_');
  const P=pdfSafe;                                   /* texto seguro para PDF */
  const PR=rows=>rows.map(r=>r.map(c=>P(c)));        /* filas seguras para tablas */

  doc.setFillColor(...PRI); doc.rect(0,0,PW,40,'F');
  doc.setFillColor(...SKY); doc.rect(0,40,PW,1.8,'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(17);
  doc.text(P(title),ML,16);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(205,224,248);
  doc.text(P('MantCAP · Gestión de mantenimiento CAP / CPP'),ML,23.5);
  doc.text(P(`Generado: ${fmtDT(new Date().toISOString())}   ·   Por: ${SES.name}`),ML,31);
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(255);
  doc.text('MantCAP',PW-ML,16,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(205,224,248);
  doc.text(APP_VERSION,PW-ML,22,{align:'right'});

  let y=52;
  doc.setFillColor(...LIGHT); doc.setDrawColor(...LINE); doc.setLineWidth(0.3);
  doc.roundedRect(ML,y,CW,24,2.5,2.5,'FD');
  const totalRuns=DB.runs.filter(r=>(locFilter==='ALL'||r.loc===locFilter)&&inChartRange(r)).length;
  const meta=[
    ['UBICACIÓN',locFilter==='ALL'?'CAP + CPP':locFilter],
    ['PERÍODO ANALIZADO',chartRangeLabel()],
    ['EQUIPOS INCLUIDOS',secs.length===1?secs[0]:`${secs.length} equipos`],
    ['RECORRIDOS DEL PERÍODO',String(totalRuns)]
  ];
  meta.forEach(([k,v],i)=>{
    const cx=ML+7+(i%2)*(CW/2-2), cy=y+(i<2?7.5:17);
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...MUT);
    doc.text(P(k),cx,cy);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text(P(v),cx,cy+5);
  });
  y+=34;

  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...PRI);
  doc.text('Resumen general',ML,y); doc.setTextColor(...INK); y+=4;
  const sumRows=secs.map(sec=>{
    const eqQs=numQs.filter(q=>q.section===sec);
    return [sec,eqQs[0].loc,String(eqQs.length),String(oorRowsForQs(eqQs).length)];
  });
  doc.autoTable({
    head:[['Equipo','Ubicación','Métricas','Hallazgos f. de rango']],
    body:PR(sumRows),startY:y,
    styles:{fontSize:8.5,cellPadding:2},
    headStyles:{fillColor:[230,238,250],textColor:PRI2},
    alternateRowStyles:{fillColor:[250,252,254]},
    columnStyles:{1:{cellWidth:26,halign:'center'},2:{cellWidth:20,halign:'center'},3:{cellWidth:32,halign:'center'}},
    margin:{left:ML,right:ML}});
  y=doc.lastAutoTable.finalY+8;

  for(const sec of secs){
    const eqQs=numQs.filter(q=>q.section===sec);
    const statRows=eqQs.map(q=>{
      const s=chartStats(q); if(!s) return null;
      return [shortName(q),String(s.n),s.avg.toFixed(2),String(s.mn),String(s.mx),s.last+(q.unit?' '+q.unit:''),s.oor?`${s.oor} (${s.pct}%)`:'0'];
    }).filter(Boolean);
    const groups=groupByUnit(eqQs);
    const imgs=[];
    for(const [unit,gq] of groups){
      const {img,runs}=await renderGroupImg(gq);
      if(img) imgs.push({unit,img,nS:gq.length,nR:runs.length});
    }
    const oor=oorRowsForQs(eqQs);

    if(y>PH()-46){doc.addPage();y=14;}
    doc.setFillColor(...PRI);
    doc.roundedRect(ML,y,CW,10.5,1.5,1.5,'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
    doc.text(P(`Equipo: ${sec}`),ML+4,y+7);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(214,228,250);
    doc.text(P(`${eqQs.length} métricas · ${imgs.length} gráficas · ${oor.length} hallazgos`),ML+CW-4,y+7,{align:'right'});
    doc.setTextColor(...INK);
    y+=16;

    if(statRows.length){
      doc.autoTable({
        head:[['Métrica','Registros','Promedio','Mín','Máx','Último valor','Fuera de rango']],
        body:PR(statRows),startY:y,
        styles:{fontSize:7.5,cellPadding:1.8},
        headStyles:{fillColor:[230,238,250],textColor:PRI2},
        alternateRowStyles:{fillColor:[250,252,254]},
        columnStyles:{0:{cellWidth:56},6:{cellWidth:22,halign:'center'}},
        margin:{left:ML,right:ML}});
      y=doc.lastAutoTable.finalY+6;
    }
    for(const it of imgs){
      const w=CW,h=w*(460/1000);
      if(y+h+13>PH()-14){doc.addPage();y=14;}
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...PRI2);
      doc.text(P(`Comparativa · ${it.unit}`),ML,y);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUT);
      doc.text(P(`(${it.nS} series · ${it.nR} recorridos)`),ML+CW,y,{align:'right'});
      doc.setTextColor(...INK);
      doc.addImage(it.img,'PNG',ML,y+2.5,w,h);
      doc.setDrawColor(...LINE); doc.setLineWidth(0.3);
      doc.rect(ML,y+2.5,w,h);
      y+=h+11;
    }
    if(oor.length){
      if(y>PH()-50){doc.addPage();y=14;}
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...BAD);
      doc.text(`Hallazgos fuera de rango (${oor.length})`,ML,y); doc.setTextColor(...INK); y+=3;
      doc.autoTable({
        head:[['Fecha','Medición','Valor','Esperado','Avería / Nota']],
        body:PR(oor),startY:y,
        styles:{fontSize:7.5,cellPadding:1.8},headStyles:{fillColor:BAD},
        alternateRowStyles:{fillColor:[253,246,246]},
        columnStyles:{1:{cellWidth:52},4:{cellWidth:46}},margin:{left:ML,right:ML}});
      y=doc.lastAutoTable.finalY+8;
    }else{
      if(y>PH()-20){doc.addPage();y=14;}
      doc.setFillColor(...OKBG); doc.setDrawColor(...OKLN); doc.setLineWidth(0.3);
      doc.roundedRect(ML,y,CW,8,1.5,1.5,'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...OKC);
      doc.text('Sin hallazgos fuera de rango en el período analizado',ML+4,y+5.4);
      doc.setTextColor(...INK); y+=13;
    }
    y+=2;
  }

  if(comments){
    if(y>PH()-45){doc.addPage();y=14;}
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...PRI);
    doc.text('Comentarios finales',ML,y); doc.setTextColor(...INK); y+=5.5;
    const lines=doc.splitTextToSize(P(comments),CW-12);
    doc.setFillColor(...LIGHT); doc.setDrawColor(...LINE); doc.setLineWidth(0.3);
    doc.roundedRect(ML,y,CW,lines.length*5+8,2.5,2.5,'FD');
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text(lines,ML+6,y+6.5);
  }

  const tot=doc.internal.getNumberOfPages();
  for(let p=1;p<=tot;p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...MUT);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.2);
    doc.line(ML,PH()-11,PW-ML,PH()-11);
    doc.text(P(`MantCAP ${APP_VERSION} · Informe de análisis`),ML,PH()-7);
    doc.text(`Página ${p} de ${tot}`,PW-ML,PH()-7,{align:'right'});
  }

  const tag=secs.length===1?safe(secs[0]):`${secs.length}_EQUIPOS`;
  doc.save(`informe_${tag}_${safe(locFilter)}_${chFrom||'inicio'}_${chTo||'hoy'}.pdf`);
  toast(`📄 Informe generado · ${secs.length} equipo${secs.length>1?'s':''}`,'ok');
}

function toggleQ(id){const q=getQ(id);q.active=!q.active;saveDB();toast(q.active?'Pregunta activada':'Pregunta desactivada','ok');renderQuestionsList();}
function editQModal(id){
  const q=id?getQ(id):null;
  modal(`<div class="mh"><h3>${q?'Editar pregunta':'Nueva pregunta'}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    <div class="fld"><label>Ubicación</label><select id="eqLoc"><option ${q&&q.loc==='CAP'?'selected':''}>CAP</option><option ${q&&q.loc==='CPP'?'selected':''}>CPP</option></select></div>
    <div class="fld"><label>Sección</label><input id="eqSec" value="${esc(q?.section||'')}"></div>
    <div class="fld"><label>Texto de la pregunta</label><input id="eqTxt" value="${esc(q?.text||'')}"></div>
    <div class="grid g3">
      <div class="fld"><label>Tipo</label><select id="eqType" ${q?'disabled':''}>${['number','select','boolean','multi','text'].map(t=>`<option ${q&&q.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="fld"><label>Unidad</label><input id="eqUnit" value="${esc(q?.unit||'')}"></div>
      <div class="fld"><label>Mín / Máx (opcional)</label><div style="display:flex;gap:6px"><input id="eqMin" type="number" step="any" value="${q?.min??''}"><input id="eqMax" type="number" step="any" value="${q?.max??''}"></div></div>
    </div>
  </div>
  <div class="mf"><button class="btn btn-gho" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="saveQ('${id||''}')">Guardar</button></div>`);
}
function saveQ(id){
  const text=$('#eqTxt').value.trim();
  if(!text){toast('Escribe el texto de la pregunta','bad');return;}
  const min=$('#eqMin').value===''?null:+$('#eqMin').value, max=$('#eqMax').value===''?null:+$('#eqMax').value;
  if(id){
    const q=getQ(id);
    Object.assign(q,{loc:$('#eqLoc').value,section:$('#eqSec').value.trim()||q.section,text,unit:$('#eqUnit').value.trim(),min,max});
  }else{
    const loc=$('#eqLoc').value;
    DB.questions.push({id:loc.toLowerCase()+(DB.qseq++),loc,section:$('#eqSec').value.trim()||'General',text,
      type:$('#eqType').value,unit:$('#eqUnit').value.trim(),min,max,required:true,options:[],ph:'',hm:'',active:true});
  }
  saveDB();closeModal();toast('Pregunta guardada','ok');renderQuestions();
}

/* ================== ADMIN · HISTORIAL (con filtro de fechas) ================== */
/* El buscador NO se redibuja al escribir: solo se actualiza la tabla (v2.13) */
let histSearch='';
let histFrom='', histTo='', histQuick='all';
function histQuickRange(k){
  histQuick=k;
  const t=new Date(); const iso=d=>d.toISOString().slice(0,10);
  if(k==='all'){histFrom='';histTo='';}
  else if(k==='today'){histFrom=iso(t);histTo=iso(t);}
  else if(k==='7'){const d=new Date();d.setDate(d.getDate()-6);histFrom=iso(d);histTo='';}
  else if(k==='30'){const d=new Date();d.setDate(d.getDate()-29);histFrom=iso(d);histTo='';}
  else if(k==='month'){histFrom=t.toISOString().slice(0,8)+'01';histTo='';}
  renderHistory();
}
function renderHistory(){
  const hqc=k=>`<button class="chip ${histQuick===k?'on':''}" onclick="histQuickRange('${k}')">${{all:'Todo',today:'Hoy','7':'7 días','30':'30 días',month:'Este mes'}[k]}</button>`;
  const histLabel=(!histFrom&&!histTo)?'Todo el historial':`${histFrom?fmtD(histFrom):'inicio'} → ${histTo?fmtD(histTo):'hoy'}`;
  $('#content').innerHTML=`${locBar(`<input id="hSearch" placeholder="Buscar técnico o ticket…" value="${esc(histSearch)}" oninput="histSearch=this.value;renderHistoryList()">`)}
  <div class="toolbar">
    <span style="font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">Fechas:</span>
    <input type="date" value="${histFrom}" onchange="histFrom=this.value;histQuick='custom';renderHistory()">
    <span style="color:var(--mut)">→</span>
    <input type="date" value="${histTo}" onchange="histTo=this.value;histQuick='custom';renderHistory()">
    ${hqc('all')}${hqc('today')}${hqc('7')}${hqc('30')}${hqc('month')}
    <span class="pill mut" style="margin-left:4px">📅 ${esc(histLabel)}</span>
  </div>
  <div class="card" id="histCard"></div>`;
  renderHistoryList();
}
function renderHistoryList(){
  const el=$('#histCard'); if(!el) return;
  const runs=runsFor()
    .filter(r=>(!histFrom||r.date.slice(0,10)>=histFrom)&&(!histTo||r.date.slice(0,10)<=histTo))
    .filter(r=>(r.techName+' '+r.ticket).toLowerCase().includes(histSearch.toLowerCase()));
  el.innerHTML=`<div class="hd"><h3>Recorridos (${runs.length})</h3></div>
  ${runs.length?`<table class="tb"><tr><th>Fecha</th><th>Sitio</th><th>Técnico</th><th>Ticket</th><th>Duración</th><th>Alertas</th><th></th></tr>
  ${runs.map(r=>`<tr>
    <td>${fmtDT(r.date)}</td><td>${locBadge(r.loc)}</td><td>${esc(r.techName)}</td><td>${esc(r.ticket)}</td>
    <td style="white-space:nowrap">${fmtDur(runDur(r))}</td>
    <td>${r.outOfRange.length?`<span class="pill bad">${r.outOfRange.length}</span>`:'<span class="pill ok">0</span>'}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn btn-gho btn-sm" onclick="openRunModal('${r.id}')">Ver</button>
      <button class="btn btn-gho btn-sm" onclick="exportRunPDF('${r.id}')">PDF</button>
      <button class="btn btn-bad btn-sm" onclick="delRun('${r.id}')">Eliminar</button>
    </td></tr>`).join('')}</table>`:'<div class="empty">Sin recorridos en el filtro seleccionado</div>'}`;
}
function delRun(id){
  confirmModal('<p>¿Eliminar este recorrido definitivamente? Esta acción no se puede deshacer.</p>',
    ()=>{DB.runs=DB.runs.filter(r=>r.id!==id);saveDB();updateBadges();toast('Recorrido eliminado','ok');renderHistory();},'Eliminar');
}

/* ================== DETALLE DE RECORRIDO / PDF ================== */
function openRunModal(id){
  const r=DB.runs.find(x=>x.id===id); if(!r) return;
  const qs=DB.questions.filter(q=>r.answers&&r.answers[q.id]!=null&&r.answers[q.id]!=='');
  const secs=[...new Set(qs.map(q=>q.section))];
  const oorMap=new Map((r.outOfRange||[]).map(a=>[a.qid,a]));
  modal(`<div class="mh"><h3>Recorrido ${fmtDT(r.date)} ${locBadge(r.loc)}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    <p style="font-size:13px;color:var(--mut);margin-bottom:12px">
      Técnico: <b style="color:var(--ink)">${esc(r.techName)}</b> · Ticket: <b style="color:var(--ink)">${esc(r.ticket)}</b> ·
      Duración: <b style="color:var(--ink)">⏱ ${fmtDur(runDur(r))}</b>
      ${r.startedAt?`<br>Inició: ${fmtDT(r.startedAt)}${r.endedAt?` · Finalizó: ${fmtDT(r.endedAt)}`:''}`:''}
    </p>
    ${secs.map(s=>`<div class="sec" style="margin-bottom:10px"><div class="st">${esc(s)}</div>
      <table class="tb">${qs.filter(q=>q.section===s).map(q=>{
        const a=oorMap.get(q.id);
        let rep='';
        if(a&&(a.confirmed||a.note)){
          rep=`<div style="margin-top:6px;font-size:11.5px">
            ${a.confirmed?'<span class="pill bad" style="font-size:10px">Avería reportada</span> ':''}
            ${a.note?`<div style="color:var(--mut);margin-top:3px">📝 ${esc(a.note)}</div>`:''}</div>`;
        }
        return `<tr><td>${esc(q.text)}${a?`<br><span style="font-size:11px;color:var(--bad)">Esperado: ${esc(a.expected)}</span>`:''}${rep}</td>
        <td style="text-align:right;white-space:nowrap">${a?'<span class="pill bad">Fuera de rango</span> ':''}<b>${esc(fmtVal(q,r.answers[q.id]))}</b></td></tr>`}).join('')}</table></div>`).join('')||'<div class="empty">Sin respuestas registradas</div>'}
  </div>
  <div class="mf"><button class="btn btn-gho" onclick="closeModal()">Cerrar</button><button class="btn btn-pri" onclick="exportRunPDF('${r.id}')">Exportar PDF</button></div>`,true);
}
function exportRunPDF(id){
  const r=DB.runs.find(x=>x.id===id); if(!r) return;
  const {jsPDF}=window.jspdf;
  const P=pdfSafe;   /* v2.13: limpia ≥ ≤ → emojis… para que el PDF se lea bien */
  const doc=new jsPDF();
  doc.setFontSize(16); doc.text(P('MantCAP · Reporte de recorrido'),14,16);
  doc.setFontSize(10);
  doc.text(P(`Ubicación: ${r.loc}    Fecha: ${fmtDT(r.date)}`),14,24);
  doc.text(P(`Técnico: ${r.techName}    Ticket: ${r.ticket}`),14,29);
  doc.text(P(`Duración del recorrido: ${fmtDur(runDur(r))}`),14,34);
  const qs=DB.questions.filter(q=>r.answers&&r.answers[q.id]!=null&&r.answers[q.id]!=='');
  const oorMap=new Map((r.outOfRange||[]).map(a=>[a.qid,a]));
  const rows=qs.map(q=>{const a=oorMap.get(q.id);
    const rep=a?[(a.confirmed?'Avería reportada.':''),(a.note||'')].filter(Boolean).join(' '):'';
    return [q.section,q.text,fmtVal(q,r.answers[q.id]),a?`Fuera de rango (${a.expected})`:'OK',rep].map(c=>P(c));});
  doc.autoTable({head:[['Sección','Medición','Valor','Estado','Avería / Reporte']],body:rows,startY:40,
    styles:{fontSize:8,cellPadding:2},headStyles:{fillColor:[14,95,216]},
    columnStyles:{0:{cellWidth:26},1:{cellWidth:56},3:{cellWidth:36},4:{cellWidth:36}},didParseCell:d=>{
      if(d.section==='body'&&d.column.index===3&&String(d.cell.raw).startsWith('Fuera')) d.cell.styles.textColor=[209,60,60];}});
  doc.save(`recorrido_${r.loc}_${r.date.slice(0,10)}.pdf`);
  toast('PDF generado','ok');
}

/* ================== ADMIN · ALERTAS ================== */
let alertView='pen';
function renderAlerts(){
  const list=alertView==='pen'?pendAlerts():alertView==='rev'?revAlerts():alertsFor();
  const qc=(k,l,n)=>`<button class="chip ${alertView===k?'on':''}" onclick="alertView='${k}';renderAlerts()">${l} (${n})</button>`;
  $('#content').innerHTML=`${locBar()}
  <div class="toolbar">
    ${qc('pen','Pendientes',pendAlerts().length)}
    ${qc('rev','Revisadas',revAlerts().length)}
    ${qc('all','Todas',alertsFor().length)}
  </div>
  <div class="card">
  ${list.length?`<table class="tb"><tr><th>Fecha</th><th>Sitio</th><th>Medición</th><th>Valor</th><th>Esperado</th><th>Avería reportada</th>${alertView!=='pen'?'<th>Solución / Estado</th>':''}<th></th></tr>
  ${list.map(a=>`<tr>
    <td>${fmtD(a.date)}</td><td>${locBadge(a.loc)}</td>
    <td><b>${esc(a.section)}</b><br><span style="font-size:12px">${esc(a.qtext)}</span></td>
    <td><span class="pill bad">${esc(a.value)}</span></td>
    <td style="font-size:12px">${esc(a.expected)}</td>
    <td>${a.confirmed?'<span class="pill ok">Sí</span>':'<span class="pill pen">No</span>'}${a.note?`<br><span style="font-size:11px;color:var(--mut)">📝 ${esc(a.note)}</span>`:''}</td>
    ${alertView!=='pen'?`<td style="font-size:12px;max-width:220px">${a.reviewNote?esc(a.reviewNote):'<span style="color:var(--mut)">—</span>'}</td>`:''}
    <td style="text-align:right;white-space:nowrap">
      ${a.reviewed
        ?`<button class="btn btn-gho btn-sm" onclick="reviewAlert('${a.runId}','${a.qid}')">Editar nota</button>
          <button class="btn btn-gho btn-sm" onclick="reopenAlert('${a.runId}','${a.qid}')">Reabrir</button>`
        :`<button class="btn btn-ok btn-sm" onclick="reviewAlert('${a.runId}','${a.qid}')">Revisada</button>`}
    </td></tr>`).join('')}</table>`:'<div class="empty">'+(alertView==='pen'?'Sin alertas pendientes 🎉':alertView==='rev'?'Aún no hay alertas revisadas':'Sin alertas por aquí 🎉')+'</div>'}
  </div>`;
}
function findAlert(runId,qid){const r=DB.runs.find(x=>x.id===runId);return {r,a:r?.outOfRange?.find(x=>x.qid===qid)};}
function reviewAlert(runId,qid){
  const {a}=findAlert(runId,qid); if(!a) return;
  modal(`<div class="mh"><h3>${a.reviewed?'Editar nota de revisión':'Marcar como revisada'}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    <p style="font-size:12.5px;color:var(--mut);margin-bottom:10px"><b style="color:var(--ink)">${esc(a.qtext)}</b><br>Valor medido: <b style="color:var(--bad)">${esc(a.value)}</b> · Esperado: ${esc(a.expected)}</p>
    <div class="fld"><label>¿Cómo se solucionó o en qué estado quedó? *</label>
      <textarea id="revNote" rows="4" placeholder="Ej: Se cambió el ventilador del gabinete, equipo operando normal. / Pendiente repuesto, se monitorea a diario…">${esc(a.reviewNote||'')}</textarea></div>
  </div>
  <div class="mf"><button class="btn btn-gho" onclick="closeModal()">Cancelar</button><button class="btn btn-ok" onclick="saveReview('${runId}','${qid}')">Guardar revisión</button></div>`);
}
function saveReview(runId,qid){
  const {a}=findAlert(runId,qid); if(!a) return;
  const note=$('#revNote').value.trim();
  if(!note){toast('Escribe cómo se solucionó o el estado final','bad');return;}
  a.reviewNote=note; a.reviewed=true; a.reviewedAt=new Date().toISOString();
  saveDB();updateBadges();closeModal();
  toast('Alerta marcada como revisada ✓','ok');renderAlerts();
}
function reopenAlert(runId,qid){
  confirmModal('<p>La alerta volverá a la lista de <b>pendientes</b>. La nota de solución se conservará por si la vuelves a revisar. ¿Continuar?</p>',
    ()=>{const {a}=findAlert(runId,qid);if(!a)return;a.reviewed=false;saveDB();updateBadges();toast('Alerta reabierta','ok');renderAlerts();},'Reabrir');
}

/* ================== ADMIN · USUARIOS ================== */
function renderUsers(){
  const techs=DB.users.filter(u=>u.role==='tech');
  $('#content').innerHTML=`${locBar()}
  <div class="card">
    <div class="hd"><h3>Usuarios técnicos (${techs.length})</h3>
      <span class="sp"><button class="btn btn-pri btn-sm" onclick="userModal()">+ Nuevo técnico</button></span></div>
    <div style="max-height:520px;overflow:auto">
    ${techs.length?`<table class="tb">
      <tr><th>Nombre</th><th>Usuario</th><th>Creado</th><th>Recorridos</th><th>Estado</th><th></th></tr>
      ${techs.map(u=>{
        const runs=DB.runs.filter(r=>r.techName===u.name).length;
        return `<tr${u.active===false?' style="opacity:.5"':''}>
          <td><b>${esc(u.name)}</b></td>
          <td style="color:var(--mut)">${esc(u.u)}</td>
          <td style="white-space:nowrap;color:var(--mut)">${fmtD(u.createdAt)}</td>
          <td>${runs}</td>
          <td>${u.active===false?'<span class="pill mut">Inactivo</span>':'<span class="pill ok">Activo</span>'}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-gho btn-sm" onclick="userModal('${esc(u.u)}')">Editar</button>
            <button class="btn ${u.active===false?'btn-ok':'btn-gho'} btn-sm" onclick="toggleUser('${esc(u.u)}')">${u.active===false?'Activar':'Desactivar'}</button>
            <button class="btn btn-bad btn-sm" onclick="delUser('${esc(u.u)}')">Eliminar</button>
          </td></tr>`;
      }).join('')}</table>`:'<div class="empty">No hay técnicos registrados</div>'}
    </div>
  </div>
  <p style="font-size:12px;color:var(--mut);margin-top:10px">💡 Los técnicos <b>inactivos</b> no pueden iniciar sesión. Un técnico con recorridos registrados no puede eliminarse (desactívalo en su lugar).</p>`;
}
function userModal(uu){
  const u=uu?DB.users.find(x=>x.u===uu&&x.role==='tech'):null;
  modal(`<div class="mh"><h3>${u?'Editar técnico':'Nuevo técnico'}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb">
    <div class="fld"><label>Nombre completo *</label><input id="usName" value="${esc(u?.name||'')}" placeholder="Ej: María Fernández Solano"></div>
    <div class="fld"><label>Nombre de usuario *</label><input id="usUser" value="${esc(u?.u||'')}" placeholder="Se genera del nombre; puedes editarlo"></div>
    ${u?'':`<button class="btn btn-gho btn-sm" style="margin-bottom:12px" onclick="$('#usUser').value=userFromName($('#usName').value)">↻ Generar del nombre</button>`}
    <div class="fld"><label>PIN (4+ caracteres) *</label><input id="usPin" type="password" value="${u?u.p:''}" placeholder="Mínimo 4 caracteres"></div>
    <div class="fld"><label>Confirmar PIN *</label><input id="usPin2" type="password" value="${u?u.p:''}"></div>
  </div>
  <div class="mf"><button class="btn btn-gho" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="saveUser('${esc(uu||'')}')">Guardar</button></div>`);
  setTimeout(()=>{const i=$('#usName');if(i)i.focus();},80);
}
function saveUser(origU){
  const name=$('#usName').value.trim();
  const uu=$('#usUser').value.trim().toLowerCase();
  const p1=$('#usPin').value, p2=$('#usPin2').value;
  if(!name){toast('Escribe el nombre completo','bad');return;}
  if(!uu){toast('Escribe el nombre de usuario','bad');return;}
  if(DB.users.some(x=>x.u===uu&&x.u!==origU)){toast('Ese nombre de usuario ya existe','bad');return;}
  if(p1.length<4){toast('El PIN debe tener al menos 4 caracteres','bad');return;}
  if(p1!==p2){toast('Los PIN no coinciden','bad');return;}
  if(origU){
    const u=DB.users.find(x=>x.u===origU&&x.role==='tech');
    if(!u){toast('Usuario no encontrado','bad');return;}
    const oldName=u.name;
    u.name=name; u.u=uu; u.p=p1;
    if(oldName!==name){
      DB.runs.forEach(r=>{ if(r.techName===oldName) r.techName=name; });
      toast('Técnico actualizado (recorridos renombrados)','ok');
    }else{
      toast('Técnico actualizado','ok');
    }
  }else{
    DB.users.push({u:uu,p:p1,role:'tech',name,active:true,createdAt:new Date().toISOString()});
    toast('Técnico creado ✓','ok');
  }
  saveDB();closeModal();renderUsers();
}
function toggleUser(uu){
  const u=DB.users.find(x=>x.u===uu&&x.role==='tech'); if(!u) return;
  u.active=(u.active===false)?true:false;
  saveDB();
  toast(u.active?`${u.name} activado`:`${u.name} desactivado (no podrá iniciar sesión)`,u.active?'ok':'');
  renderUsers();
}
function delUser(uu){
  const u=DB.users.find(x=>x.u===uu&&x.role==='tech'); if(!u) return;
  const runs=DB.runs.filter(r=>r.techName===u.name).length;
  if(runs>0){
    toast(`No se puede eliminar: ${u.name} tiene ${runs} recorrido(s). Desactívalo en su lugar.`,'bad');
    return;
  }
  confirmModal(`<p>¿Eliminar al técnico <b>${esc(u.name)}</b> definitivamente? Esta acción no se puede deshacer.</p>`,
    ()=>{DB.users=DB.users.filter(x=>!(x.u===uu&&x.role==='tech'));saveDB();toast('Técnico eliminado','ok');renderUsers();},'Eliminar');
}

  <div class="grid g2">

      </div>
    </div></div>
    <div class="card"><div class="hd"><h3>Sincronización en la nube ☁️</h3>
      <span class="sp"><button class="btn ${enLinea?'btn-pri':'btn-gho'} btn-sm" id="btnSync" onclick="doManualSync()">☁️ Sincronizar ahora</button></span></div><div class="bd">
      <p style="font-size:13px;color:var(--mut);margin-bottom:10px">Estado: <b style="color:${colorNube}">${estadoNube}</b></p>
      ${ultimo?`<p style="font-size:13px;color:var(--mut);margin-bottom:10px">Última sincronización: <b>${fmtDT(ultimo)}</b></p>`:''}
      <p style="font-size:12.5px;color:var(--mut)">La app también sincroniza automáticamente al guardar y al reconectar. Usa el botón para forzarla ahora.</p>
    </div></div>
    <div class="card"><div class="hd"><h3>Zona de riesgo</h3></div><div class="bd">
      <p style="font-size:13px;color:var(--mut);margin-bottom:12px">Restablece las preguntas y regenera datos demo. Se pierden los recorridos guardados.</p>
